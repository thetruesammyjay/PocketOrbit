[project]
name = "pocketorbit-api"
version = "0.1.0"
description = "Read-only portfolio API for PocketOrbit"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2,<3",
  "fastapi[standard]>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2,<3"
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
